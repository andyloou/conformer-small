#gSJNysTR6jtB
model:
  features_extractor_params:
    global_cmvn_path: null
  num_mel_bins: 80
  subsampling_channel: 176
  subsampling_dropout: 0.1
  type_encoder: 'conformer'
  sinusoidal_pos_enc_style: add
  position_dropout: 0.1
  encoder_params:
    d_model: 176
    n_layers: 16
    nhead: 4
    dropout: 0.1
    conv_kernel_size: 31
    conv_mult: 1
    ffn_mult: 4
    pre_norm: True
  ctc_weight: 1.0
  ctc_linear_dropout: 0.1
  
  # ===== TĂNG DATA AUGMENTATION =====
  freq_masks: 3                    # ← Tăng từ 2
  time_masks: 10                   # ← Tăng từ 5
  freq_width: 30                   # ← Tăng từ 27
  time_width: 0.1                  # ← Tăng từ 0.05
  
  decoder_params:
    n_layers: 1
    d_model: 176
    n_head: 4
    dropout: 0.1
    pre_norm: True
  label_smoothing_weight: 0.0
  label_smoothing_normalize_length: false

preprocessor:
  sample_rate: 16000
  normalize: per_feature
  window_size: 0.025
  window_stride: 0.01
  window: hann
  features: 80
  n_fft: 512
  log: true
  frame_splicing: 1
  dither: 1.0e-05
  pad_to: 0
  pad_value: 0.0

dataset:
  use_huggingface: false
  # dataset_name: linhtran92/viet_bud500
  hf_cache_dir: /home/datasets/viet_bud500
  train_filepath : /home/datasets/viet_bud500/train
  test_filepath : /home/datasets/viet_bud500/test 
  validation_filepath: /home/datasets/viet_bud500/validation
  max_duration: 15.0
  target_sampling_rate: 16000
   
  bpe_model_path: data/bpe_4000/bpe.model
  
  batch_size: 64                  # ← Giảm từ 64 (stability)
  num_worker: 12

train:
  output_dir: exps/bud500/conformer_phase1
  freeze_encoder: true          
  resume_mode: "selective"        
  debug_lr: true
  debug freeze: true        
  num_epoch: 15              
  lr: 0.0005                       
  warmup_steps: 2000             
  weight_decay: 1.0e-5           
  acc_steps: 4            
  use_amp: false                  
  pretrained_path: /path-to-pretrain-model-english
  wandb_config:
    project: bud500-asr-phase1
    tag: conformer-freeze-encoder-v2

train:
  output_dir: exps/bud500/conformer_phase2
  freeze_encoder: false        
  resume_mode: "full"          
  num_epoch: 50                 
  encoder_lr: 5.0e-5              
  decoder_lr: 1.0e-3              
  other_lr: 5.0e-3                 
  warmup_steps: 7000         
  weight_decay: 1.0e-5
  acc_steps: 4           
  use_amp: false                  
  pretrained_path: /path-to-last-epoch-frozen
  wandb_config:
    project: bud500-asr-phase2
    tag: conformer-unfreeze-encoder-v2

decode:
  beam_size: 20
  kenlm_path: data/lm-5gram-2,3,4,5.binary
  word_vocab_path: null
  kenlm_alpha: 0.6
  kenlm_beta: 2.0
